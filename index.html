<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon</title>
<meta name="description" content="This site is under construction. Coming soon.">
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0b0f14;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }

  .wrap { max-width: 560px; }

  .spinner {
    width: 44px;
    height: 44px;
    margin: 0 auto 32px;
    border: 3px solid rgba(230, 237, 243, 0.15);
    border-top-color: #ffb325;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }

  p {
    color: #9aa7b2;
    font-size: 1.05rem;
    line-height: 1.6;
  }

  a { color: #ffb325; text-decoration: none; }
  a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 3s; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="spinner" role="presentation"></div>
    <h1>Coming Soon</h1>
    <p>This site is under construction. Something new is on the way.</p>
    <p><a href="mailto:hello@jraikhola.com.np">hello@jraikhola.com.np</a></p>
  </main>
</body>
</html>
